{{- /*
TokenReview: the services that check a caller's projected token (audience and identity) ask the
API server whose token it is. The three the agent calls (tool gateway, LLM gateway, dispatcher)
and the three fakes of the outside systems (their callers are the executor and register sync).
That is the only cluster-wide right in the chart.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ah-tokenreview
  labels:
    {{- include "ah.labels" (dict "root" . "name" "tokenreview") | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ah-tokenreview
  labels:
    {{- include "ah.labels" (dict "root" . "name" "tokenreview") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ah-tokenreview
subjects:
  - {kind: ServiceAccount, name: tool-gateway, namespace: ah-gateway}
  - {kind: ServiceAccount, name: llm-gateway, namespace: ah-agent}
  - {kind: ServiceAccount, name: dispatcher, namespace: ah-intake}
  - {kind: ServiceAccount, name: fake-register, namespace: ah-fakes}
  - {kind: ServiceAccount, name: fake-dso, namespace: ah-fakes}
  - {kind: ServiceAccount, name: fake-sms, namespace: ah-fakes}
