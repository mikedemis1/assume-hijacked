{{- /*
kind only: PostgreSQL in ah-data, set up once by the postgres-init Job, which runs the same
db/init/init.sh as Compose and CI. On Azure the database is the flexible server behind a
private endpoint, and db-migrate.yaml sets it up instead.
*/ -}}
{{- if eq .Values.env "kind" }}
{{- $root := . -}}
{{- $s := .Values.secrets -}}
{{- $uid := include "ah.appUid" . | int -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: ah-data
  labels:
    {{- include "ah.labels" (dict "root" $root "name" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required with env=kind" $s.postgresPassword | quote }}
  {{- range $role := include "ah.dbRoles" . | fromJsonArray }}
  DB_PASSWORD_{{ upper $role }}: {{ required (printf "secrets.dbPasswords.%s is required with env=kind" $role) (index $s.dbPasswords $role) | quote }}
  {{- end }}
---
{{ include "ah.dbFiles" (dict "root" $root "namespace" "ah-data" "name" "postgres") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: ah-data
  labels:
    {{- include "ah.labels" (dict "root" $root "name" "postgres") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ah-data
  labels:
    {{- include "ah.labels" (dict "root" $root "name" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ah-data
  labels:
    {{- include "ah.labels" (dict "root" $root "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "ah.labels" (dict "root" $root "name" "postgres") | nindent 8 }}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with include "ah.systemPlacement" $root }}{{ . | nindent 6 }}{{ end }}
      # The image's own postgres user (UID 70 in the Alpine image), not the app user.
      securityContext:
        {{- include "ah.podSecurityContext" 70 | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: {{ .Values.db.name | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: POSTGRES_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            {{- include "ah.containerSecurityContext" 70 | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.db.name | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Runs once, after the first install: init.sh is not idempotent (CREATE ROLE, CREATE DATABASE).
# It waits for the server, then applies db/sql exactly as Compose's initdb hook and CI do.
# Helm runs a post-install hook after it has created the release and, with --wait, only once every
# pod is ready; the components are not ready until the database is set up, so a --wait install
# would wait for this hook and the hook for the wait. scripts/kind-deploy.sh therefore runs helm
# with --wait=hookOnly (Helm waits for this Job only) and waits for the rollouts itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: ah-data
  labels:
    {{- include "ah.labels" (dict "root" $root "name" "postgres-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ah.labels" (dict "root" $root "name" "postgres-init") | nindent 8 }}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      {{- with include "ah.systemPlacement" $root }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- include "ah.podSecurityContext" $uid | nindent 8 }}
      containers:
        - name: init
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            # The user and database are named: the app UID has no entry in the image's
            # /etc/passwd, and pg_isready without -U gives up ("no attempt") instead of waiting.
            - until pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done; exec sh /db/init/init.sh
          env:
            - {name: PGHOST, value: {{ include "ah.host" (list "postgres" "ah-data") }}}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: {{ .Values.db.name | quote }}}
            - {name: SQL_DIR, value: /db/sql}
            - {name: DEMO_VULNERABLE, value: {{ ternary "1" "0" .Values.db.demoVulnerable | quote }}}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secrets, key: POSTGRES_PASSWORD}
            {{- include "ah.dbRolePasswordEnv" (dict "root" $root "secret" "postgres-secrets") | nindent 12 }}
          volumeMounts:
            {{- include "ah.dbFilesMounts" . | nindent 12 }}
          securityContext:
            {{- include "ah.containerSecurityContext" $uid | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.job | nindent 12 }}
      volumes:
        {{- include "ah.dbFilesVolumes" . | nindent 8 }}
{{- end }}
