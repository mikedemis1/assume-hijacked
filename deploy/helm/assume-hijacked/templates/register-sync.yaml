{{- /*
Register sync (ah-core): adds protection flags from the register; never removes them. It reads
the register (fake-register) with its projected token for that audience.
*/ -}}
{{ include "ah.workload" (dict
    "root" .
    "name" "register-sync"
    "namespace" "ah-core"
    "command" (list "python" "-m" "app.register.sync")
    "ops" true
    "env" (list
      (dict "name" "CALLER_AUTH" "value" "k8s")
      (dict "name" "REGISTER_URL" "value" (printf "http://%s:8090/protected" (include "ah.host" (list "fake-register" "ah-fakes")))))
    "audiences" (list "fake-register")
    "dbRole" "register_sync") }}
