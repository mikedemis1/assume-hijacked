{{- /*
One namespace per trust zone (contract: Helm namespaces). ah-data exists only on kind, where
the chart runs PostgreSQL itself. ah-monitoring belongs to the monitoring stack (B5), not here.
*/ -}}
{{- $namespaces := list "ah-intake" "ah-agent" "ah-gateway" "ah-tools" "ah-core" "ah-staff" "ah-fakes" -}}
{{- if eq .Values.env "kind" -}}
{{- $namespaces = append $namespaces "ah-data" -}}
{{- end -}}
{{- range $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    app.kubernetes.io/part-of: assume-hijacked
{{- end }}
