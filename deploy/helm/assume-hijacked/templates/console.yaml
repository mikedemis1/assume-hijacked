{{- /*
Approval console (ah-staff). AUTH_MODE=entra validates Entra ID tokens; dev is for kind only
(values.schema.json and this template refuse it with env=azure, and the console refuses to start
that way).
*/ -}}
{{- $c := .Values.console -}}
{{- /* Also here, not only in the schema: helm --skip-schema-validation skips the schema. */ -}}
{{- if and (eq .Values.env "azure") (ne $c.authMode "entra") -}}
{{- fail "console.authMode must be entra with env=azure (dev auth trusts a header)" -}}
{{- end -}}
{{- $env := list
    (dict "name" "AUTH_MODE" "value" $c.authMode)
    (dict "name" "ENTRA_TENANT_ID" "value" $c.entra.tenantId)
    (dict "name" "ENTRA_CLIENT_ID" "value" $c.entra.clientId) -}}
{{- if eq $c.authMode "dev" -}}
{{- $env = append $env (dict "name" "CONSOLE_DEV_USERS" "value" $c.devUsers) -}}
{{- end -}}
{{- $files := list -}}
{{- if eq $c.authMode "entra" -}}
{{- $env = append $env (dict "name" "CONSOLE_REDIRECT_URI" "value" (required "console.redirectUri is required with Entra sign-in" $c.redirectUri)) -}}
{{- $files = append $files (dict "key" "entra-client-secret" "env" "CONSOLE_CLIENT_SECRET_FILE"
    "value" .Values.secrets.consoleClientSecret "kvObject" "console-client-secret"
    "what" "secrets.consoleClientSecret") -}}
{{- end -}}
{{ include "ah.workload" (dict
    "root" .
    "name" "console"
    "namespace" "ah-staff"
    "command" (list "python" "-m" "app.console.main")
    "ports" (list (dict "name" "http" "port" 8084))
    "ops" true
    "env" $env
    "files" $files
    "dbRole" "approver") }}
