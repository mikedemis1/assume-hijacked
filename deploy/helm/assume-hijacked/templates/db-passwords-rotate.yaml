{{- /*
azure only, and never part of a deploy: the passwords step of db-migrate.yaml on its own, to
rotate the workload database passwords. scripts/azure-rotate-db-passwords.sh renders it with
`helm template --show-only` from the deployed release's values, runs it, waits longer than the
Secrets Store CSI driver's rotation interval and then restarts the pods with a database role.
Rendered only with dbPasswords.rotationJob=true, and refused on an upgrade: an upgrade that
rotated the passwords would leave the pods on the old ones (db-migrate.yaml explains why).
*/ -}}
{{- if .Values.dbPasswords.rotationJob }}
{{- if ne .Values.env "azure" -}}
{{- fail "dbPasswords.rotationJob is for env=azure only (kind keeps its passwords in Kubernetes Secrets)" -}}
{{- end -}}
{{- if .Release.IsUpgrade -}}
{{- fail "dbPasswords.rotationJob is never deployed with helm upgrade: run scripts/azure-rotate-db-passwords.sh" -}}
{{- end -}}
{{ include "ah.dbSetupJob" (dict "root" . "name" (required "dbPasswords.rotationJobName is required" .Values.dbPasswords.rotationJobName) "hook" "" "migrate" false) }}
{{- end }}
