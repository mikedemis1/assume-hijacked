{{- /*
The attack suite in the cluster (tests/attacks/, image from tests/attacks/Dockerfile), run with `helm test`
after a deploy: any open wall fails the test, and so the pipeline.

One probe pod per component, in that component's namespace and with its app.kubernetes.io/name
label, so every NetworkPolicy and CiliumNetworkPolicy selects it exactly as it selects the
component. It runs `python -m attacks.run suite <component>`: the probes of tests/attacks/probes.py
whose source is that component, against the real Services. It prints one JSON line per probe
({"edge", "expected", "observed", ...}) and exits 1 on a mismatch.

They are bare Pods with the helm.sh/hook "test" annotation, not Jobs: a Job in ah-agent must be
the agent Job exactly (policy ah-agent-job-template), and a probe pod is not. Each runs as its own
ServiceAccount attack-suite, which has no rights and no token. A readiness probe that never
passes keeps them out of every Service's ready endpoints: they carry a component's label, and a
real client must never be sent to one.

The database is probed at an address every pod can reach without a name lookup: on kind the
postgres Service name (a cluster name, which every pod may resolve); on Azure the private
endpoint's IP (attackSuite.databaseAddress), because most pods may not resolve the server's name,
and a refused lookup must not pass for the network wall.

Off by default: attackSuite.enabled and a pinned attackSuite.image from the registry.
*/ -}}
{{- if .Values.attackSuite.enabled }}
{{- $root := . -}}
{{- $v := .Values -}}
{{- $image := required "attackSuite.image is required with attackSuite.enabled" $v.attackSuite.image -}}
{{- if not (hasPrefix $v.registry $image) -}}
{{- fail (printf "attackSuite.image must come from the registry %s, got %s" $v.registry $image) -}}
{{- end -}}
{{- $dbAddress := $v.db.host -}}
{{- if eq $v.env "azure" -}}
{{- $dbAddress = required "attackSuite.databaseAddress (the private endpoint IP of PostgreSQL) is required with env=azure" $v.attackSuite.databaseAddress -}}
{{- $cidr := $v.network.databaseCidr -}}
{{- /* A /24 or longer range: the address shares its first three octets. */ -}}
{{- if not (hasPrefix (printf "%s." (join "." (slice (splitList "." (first (splitList "/" $cidr))) 0 3))) $dbAddress) -}}
{{- fail (printf "attackSuite.databaseAddress %s is not in network.databaseCidr %s" $dbAddress $cidr) -}}
{{- end -}}
{{- end -}}
{{- $uid := include "ah.appUid" . | int -}}
{{- $sandboxed := list "ah-agent" "ah-tools" -}}
{{- /* The chart components a probe runs as (tests/attacks/probes.py COMPONENTS, one tool for all
five). postgres only on kind, where the database is a pod of this chart. */ -}}
{{- $sources := list
  (list "agent" "ah-agent") (list "llm-gateway" "ah-agent") (list "dispatcher" "ah-intake")
  (list "tool-gateway" "ah-gateway") (list "tool-lookup-account" "ah-tools")
  (list "risk-engine" "ah-core") (list "executor" "ah-core")
  (list "console" "ah-staff") -}}
{{- if eq $v.env "kind" }}{{ $sources = append $sources (list "postgres" "ah-data") }}{{ end -}}
{{- $namespaces := list -}}
{{- range $sources }}{{ $namespaces = append $namespaces (index . 1) }}{{ end -}}
{{- range $ns := $namespaces | uniq }}
---
{{ include "ah.serviceAccount" (dict "root" $root "name" "attack-suite" "namespace" $ns "workloadIdentity" false) }}
{{- end }}
{{- range $s := $sources }}
{{- $name := index $s 0 }}
{{- $ns := index $s 1 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: attack-suite-{{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: assume-hijacked
    app.kubernetes.io/component: attack-suite
    helm.sh/chart: {{ printf "%s-%s" $root.Chart.Name $root.Chart.Version }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  serviceAccountName: attack-suite
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  activeDeadlineSeconds: 120
  {{- if has $ns $sandboxed }}
  runtimeClassName: {{ $v.sandbox.runtimeClass }}
  {{- else }}
  {{- with include "ah.systemPlacement" $root }}{{ . | nindent 2 }}{{ end }}
  {{- end }}
  securityContext:
    {{- include "ah.podSecurityContext" $uid | nindent 4 }}
  containers:
    - name: probe
      image: {{ $image }}
      imagePullPolicy: IfNotPresent
      args: ["suite", {{ $name | quote }}]
      env:
        - {name: AH_DB_ADDRESS, value: {{ $dbAddress | quote }}}
      readinessProbe:
        # Never ready, so never a Service endpoint (see above).
        exec: {command: ["false"]}
        periodSeconds: 60
      securityContext:
        {{- include "ah.containerSecurityContext" $uid | nindent 8 }}
      resources:
        {{- toYaml $v.resources.job | nindent 8 }}
{{- end }}
{{- end }}
