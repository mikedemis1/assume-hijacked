# Mailpit: the local mail catcher Alertmanager sends to (namespace ah-monitoring). It accepts
# any mail on SMTP 1025 and shows it on the web port 8025; nothing is delivered anywhere.
# Look at the mails with `kubectl -n ah-monitoring port-forward svc/mailpit 8025:8025`.
#
# Image v1.31.3 (2026-09-27, more than 14 days old when pinned), pinned by the digest of the
# multi-arch index (`docker buildx imagetools inspect axllent/mailpit:v1.31.3`, 2026-10-17).
# The container was run with a read-only root file system, user 10001, no capabilities and a
# writable /tmp only: it took a mail on 1025 and listed it on 8025.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailpit
  namespace: ah-monitoring
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: assume-hijacked-monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ah-monitoring
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: assume-hijacked-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: assume-hijacked-monitoring
    spec:
      serviceAccountName: mailpit
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
          imagePullPolicy: IfNotPresent
          # Keep a few hundred mails at most; the demo sends a handful.
          env:
            - {name: MP_MAX_MESSAGES, value: "500"}
          ports:
            - {name: smtp, containerPort: 1025, protocol: TCP}
            - {name: http, containerPort: 8025, protocol: TCP}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ah-monitoring
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: assume-hijacked-monitoring
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - {name: smtp, port: 1025, targetPort: smtp, protocol: TCP}
    - {name: http, port: 8025, targetPort: http, protocol: TCP}
