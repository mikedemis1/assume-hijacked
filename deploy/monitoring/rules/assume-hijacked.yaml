# Alert rules of the application, as a PrometheusRule for the operator
# (scripts/kind-monitoring.sh applies it). The unit tests are in assume-hijacked.test.yaml next to
# it; tests/k8s/test_monitoring.py runs `promtool check rules` and `promtool test rules` on them.
#
# Metric names come from the application: app/executor/main.py (the executor writes the time of its
# last poll) and app/risk/service.py (export_state writes risk_agents_paused). The `job` label is the component
# name: the PodMonitor in kube-prometheus-values.yaml sets it from app.kubernetes.io/name.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: assume-hijacked
  namespace: ah-monitoring
  labels:
    app.kubernetes.io/name: assume-hijacked-rules
    app.kubernetes.io/part-of: assume-hijacked-monitoring
spec:
  groups:
    - name: assume-hijacked
      rules:
        # The executor is the only component that carries out effects. It writes the time of its
        # last poll every few seconds. Older than a minute means it is stuck. When it is stopped
        # or gone, the metric disappears and the first half gives no answer, so absent() covers
        # that case.
        - alert: ExecutorHeartbeatStale
          expr: time() - executor_last_poll_timestamp_seconds > 60 or absent(executor_last_poll_timestamp_seconds)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: The executor has not polled for more than a minute
            description: >-
              executor_last_poll_timestamp_seconds is older than 60 seconds or missing.
              Approved requests are not being carried out.

        # The kill switch: the risk engine pauses every agent after three denials on one lease,
        # and exports risk_agents_paused (1 while paused). It stays 1 until a SeniorApprover
        # resumes in the console, so the alert stays firing until then.
        - alert: KillSwitchFired
          expr: max(risk_agents_paused) == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: All agents are paused (kill switch)
            description: >-
              risk_agents_paused is 1. The risk engine paused every agent after repeated
              denials on one lease. The tool gateway refuses every call until a SeniorApprover
              resumes in the console.
