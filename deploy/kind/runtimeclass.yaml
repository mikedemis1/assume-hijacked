# Local stand-in for the Kata RuntimeClass. On AKS the real kata-vm-isolation class (Kata
# containers on the sandbox pool) is provided by the platform; here the handler is plain runc,
# so only the scheduling is real: pods using it go to the sandbox node and tolerate its taint.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-vm-isolation
handler: runc
scheduling:
  nodeSelector:
    ah/pool: sandbox
  tolerations:
    - key: ah/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
