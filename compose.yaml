name: assume-hijacked

x-app: &app
  build:
    context: .
    additional_contexts:
      wheels: ${LOCAL_WHEELS_DIR:-./build/empty}
    secrets:
      - pip_cert
  # No `networks:` here: every service lists its own edge networks (see the block below), so no
  # service gets a route to another one by default.
  depends_on:
    db:
      condition: service_healthy

# Non-secret settings shared by every component that talks to the database.
# Each service adds ONLY its own DB_PASSWORD_<ROLE> next to this.
x-db-common: &db-common
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: supplier
  VULNERABLE: ${VULNERABLE:-false}

# Build-time only. Normally an empty file. On a network that intercepts TLS
# (e.g. antivirus HTTPS scanning), set PIP_CERT_FILE in .env to the CA bundle.
# LOCAL_WHEELS_DIR (default: an empty folder) can point at a folder of .whl files
# that are installed first, for packages whose PyPI page cannot be downloaded.
secrets:
  pip_cert:
    file: ${PIP_CERT_FILE:-./build/no-pip-cert.empty}
  # The tool gateway's key pair (sh scripts/gen-gateway-key.sh writes it; build/keys/ is not in the
  # repository). Every tool holds the public key and checks each request's token with it.
  gateway_public_key:
    file: ./build/keys/gateway.pub
  # The private key signs the tokens. Only the tool gateway holds it: the agent, which is the
  # component a hijacked model can reach, holds no key and cannot make a token for any tool.
  gateway_signing_key:
    file: ./build/keys/gateway.pem

# One network per allowed edge between two services, all `internal: true` (no route out). A service
# is on exactly the networks of the edges it is allowed to use and on no other, so a hijacked
# container can only talk to the peers of its own edges. Docker resolves a service name only on a
# network both share, so the other services are not even visible by name. The names follow the
# communication matrix of the design.
#
# What the stack has today:
#   edge_agent_gateway     agent -> tool-gateway   the agent reaches a tool only through the gateway
#   edge_agent_dispatcher  agent -> dispatcher     the agent asks for its ticket and sends its reply
#   edge_agent_llmgw       agent -> llm-gateway    the agent's only way to a model
#   edge_gateway_<tool> x5 tool-gateway -> tool    the gateway is the only caller of a tool
#   edge_gateway_risk      tool-gateway -> risk-engine   POST /decide for every call
#   edge_gateway_db        tool-gateway -> db      the lease, the stop switch, the record of calls
#   edge_dispatcher_db     dispatcher -> db        runs, leases, replies
#   edge_<tool>_db x5      tool -> db              matrix row 12
#   edge_executor_db       executor -> db          matrix row 14
#   edge_risk_db           risk-engine -> db
#   edge_register_db       register-sync -> db
#   edge_register_fakes    register-sync -> fake-register
#   edge_executor_dso      executor -> fake-dso    } the matrix's executor -> fakes edge, one network
#   edge_executor_sms      executor -> fake-sms    } per fake so the two fakes cannot reach each other
#   edge_console_db        console -> db          staff approvals and operational status
# Which edges are NOT here is tested: tests/test_smoke.py (agent -> db, agent -> every tool, agent ->
# risk engine, llm-gateway -> everything (it has no peer but the agent), dispatcher -> everything but the db,
# tool -> tool, executor -> tools, risk-engine -> tools, register-sync -> tools, gateway -> the
# executor, register-sync and the fakes, fakes -> db, fake -> fake, agent, tools and risk-engine
# -> fakes).
#
# Docker does not publish a host port for a container that is only on an internal network
# (checked on Docker Desktop for Windows: `docker port` shows nothing and 127.0.0.1:<port> refuses).
# The tests and psql on this PC need the db port, so the db is also on `hostaccess`, a normal
# network also used by the console for its local browser port. These two services have a route out.
networks:
  # The subnets of the agent's three edges are pinned because the gateway, the dispatcher and the LLM
  # gateway tell the agent from the other containers on their other edges by source address
  # (CALLER_SUBNET below, app/gateway/auth.py): only the agent is on this network, so a call from any
  # other address is refused.
  edge_agent_gateway:
    internal: true
    ipam:
      config:
        - subnet: 10.250.1.0/24
  edge_agent_dispatcher:
    internal: true
    ipam:
      config:
        - subnet: 10.250.2.0/24
  edge_agent_llmgw:
    internal: true
    ipam:
      config:
        - subnet: 10.250.3.0/24
  edge_dispatcher_db: {internal: true}
  edge_gateway_read_ticket: {internal: true}
  edge_gateway_lookup_account: {internal: true}
  edge_gateway_request_disconnection: {internal: true}
  edge_gateway_issue_bill_credit: {internal: true}
  edge_gateway_set_temp_protection: {internal: true}
  edge_gateway_risk: {internal: true}
  edge_gateway_db: {internal: true}
  edge_read_ticket_db: {internal: true}
  edge_lookup_account_db: {internal: true}
  edge_request_disconnection_db: {internal: true}
  edge_issue_bill_credit_db: {internal: true}
  edge_set_temp_protection_db: {internal: true}
  edge_executor_db: {internal: true}
  edge_risk_db: {internal: true}
  edge_register_db: {internal: true}
  edge_console_db:
    internal: true
    ipam:
      config:
        - subnet: 10.250.4.0/24
  edge_register_fakes: {internal: true}
  edge_executor_dso: {internal: true}
  edge_executor_sms: {internal: true}
  hostaccess: {}

services:
  db:
    # Pinned by digest (multi-arch index). Tag postgres:17-alpine, resolved 2026-10-15.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    # The db is the one service on every database edge, plus hostaccess (see above).
    networks:
      - edge_read_ticket_db
      - edge_lookup_account_db
      - edge_request_disconnection_db
      - edge_issue_bill_credit_db
      - edge_set_temp_protection_db
      - edge_gateway_db
      - edge_dispatcher_db
      - edge_executor_db
      - edge_risk_db
      - edge_register_db
      - edge_console_db
      - hostaccess
    environment:
      POSTGRES_DB: supplier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_PASSWORD_TOOL_READ_TICKET: ${DB_PASSWORD_TOOL_READ_TICKET:?set DB_PASSWORD_TOOL_READ_TICKET in .env}
      DB_PASSWORD_TOOL_LOOKUP_ACCOUNT: ${DB_PASSWORD_TOOL_LOOKUP_ACCOUNT:?set DB_PASSWORD_TOOL_LOOKUP_ACCOUNT in .env}
      DB_PASSWORD_TOOL_REQUEST_DISCONNECTION: ${DB_PASSWORD_TOOL_REQUEST_DISCONNECTION:?set DB_PASSWORD_TOOL_REQUEST_DISCONNECTION in .env}
      DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT: ${DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT:?set DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT in .env}
      DB_PASSWORD_TOOL_SET_TEMP_PROTECTION: ${DB_PASSWORD_TOOL_SET_TEMP_PROTECTION:?set DB_PASSWORD_TOOL_SET_TEMP_PROTECTION in .env}
      DB_PASSWORD_EXECUTOR: ${DB_PASSWORD_EXECUTOR:?set DB_PASSWORD_EXECUTOR in .env}
      DB_PASSWORD_APPROVER: ${DB_PASSWORD_APPROVER:?set DB_PASSWORD_APPROVER in .env}
      DB_PASSWORD_GATEWAY: ${DB_PASSWORD_GATEWAY:?set DB_PASSWORD_GATEWAY in .env}
      DB_PASSWORD_RISK_ENGINE: ${DB_PASSWORD_RISK_ENGINE:?set DB_PASSWORD_RISK_ENGINE in .env}
      DB_PASSWORD_DISPATCHER: ${DB_PASSWORD_DISPATCHER:?set DB_PASSWORD_DISPATCHER in .env}
      DB_PASSWORD_REGISTER_SYNC: ${DB_PASSWORD_REGISTER_SYNC:?set DB_PASSWORD_REGISTER_SYNC in .env}
      # 1 adds the demo-only function behind VULNERABLE=true (db/sql/90-vulnerable-demo.sql).
      DEMO_VULNERABLE: ${DEMO_VULNERABLE:-0}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sql:/db/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d supplier"]
      interval: 2s
      retries: 30

  console:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_APPROVER: ${DB_PASSWORD_APPROVER:?set DB_PASSWORD_APPROVER in .env}
      APP_ENV: local
      AUTH_MODE: dev
      CONSOLE_DEV_USERS: '{"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa":["Approver"],"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb":["SeniorApprover"],"cccccccc-cccc-4ccc-8ccc-cccccccccccc":["SeniorApprover"]}'
    restart: unless-stopped
    networks:
      - edge_console_db
      - hostaccess
    ports:
      - "127.0.0.1:8084:8084"
    command: ["python", "-m", "app.console.main"]

  tool-read-ticket:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_TOOL_READ_TICKET: ${DB_PASSWORD_TOOL_READ_TICKET:?set DB_PASSWORD_TOOL_READ_TICKET in .env}
      TOOL_NAME: read_ticket
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
    networks:
      - edge_read_ticket_db
      - edge_gateway_read_ticket
    secrets:
      - gateway_public_key
    command: ["python", "-m", "app.tools.serve", "read_ticket"]

  tool-lookup-account:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_TOOL_LOOKUP_ACCOUNT: ${DB_PASSWORD_TOOL_LOOKUP_ACCOUNT:?set DB_PASSWORD_TOOL_LOOKUP_ACCOUNT in .env}
      TOOL_NAME: lookup_account
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
    networks:
      - edge_lookup_account_db
      - edge_gateway_lookup_account
    secrets:
      - gateway_public_key
    command: ["python", "-m", "app.tools.serve", "lookup_account"]

  tool-request-disconnection:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_TOOL_REQUEST_DISCONNECTION: ${DB_PASSWORD_TOOL_REQUEST_DISCONNECTION:?set DB_PASSWORD_TOOL_REQUEST_DISCONNECTION in .env}
      TOOL_NAME: request_disconnection
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
    networks:
      - edge_request_disconnection_db
      - edge_gateway_request_disconnection
    secrets:
      - gateway_public_key
    command: ["python", "-m", "app.tools.serve", "request_disconnection"]

  tool-issue-bill-credit:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT: ${DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT:?set DB_PASSWORD_TOOL_ISSUE_BILL_CREDIT in .env}
      TOOL_NAME: issue_bill_credit
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
    networks:
      - edge_issue_bill_credit_db
      - edge_gateway_issue_bill_credit
    secrets:
      - gateway_public_key
    command: ["python", "-m", "app.tools.serve", "issue_bill_credit"]

  tool-set-temp-protection:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_TOOL_SET_TEMP_PROTECTION: ${DB_PASSWORD_TOOL_SET_TEMP_PROTECTION:?set DB_PASSWORD_TOOL_SET_TEMP_PROTECTION in .env}
      TOOL_NAME: set_temp_protection
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
    networks:
      - edge_set_temp_protection_db
      - edge_gateway_set_temp_protection
    secrets:
      - gateway_public_key
    command: ["python", "-m", "app.tools.serve", "set_temp_protection"]

  executor:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_EXECUTOR: ${DB_PASSWORD_EXECUTOR:?set DB_PASSWORD_EXECUTOR in .env}
      # After each order and each notice, one call to the grid operator / the SMS provider
      # (app/executor/outside.py). No token in Compose: these edges are the wall.
      DSO_URL: http://fake-dso:8091/orders
      SMS_URL: http://fake-sms:8092/messages
    # Comes back after a crash or a database restart; the requests wait in the table meanwhile.
    restart: unless-stopped
    # Port 9000 serves /healthz and /metrics (app/common/ops.py). Nothing publishes it and no
    # monitoring edge exists yet, so only the container itself can reach it today.
    networks:
      - edge_executor_db
      - edge_executor_dso
      - edge_executor_sms
    # The fakes first, so the first notice or order after a restart finds its peer listening.
    depends_on:
      db:
        condition: service_healthy
      fake-dso:
        condition: service_started
      fake-sms:
        condition: service_started
    command: ["python", "-m", "app.executor.main"]

  # Judges every tool call (POST /decide on 8082, called by the tool gateway on edge_gateway_risk)
  # and gives every pending effect request a risk tier, which the executor waits on. Port 9000
  # serves /healthz and /metrics.
  risk-engine:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_RISK_ENGINE: ${DB_PASSWORD_RISK_ENGINE:?set DB_PASSWORD_RISK_ENGINE in .env}
    restart: unless-stopped
    networks:
      - edge_risk_db
      - edge_gateway_risk
    command: ["python", "-m", "app.risk.main"]

  # Adds protection flags from the state register every 30 s and marks the register fresh; it
  # can never remove one (db/sql/07-register.sql). Port 9000 serves /healthz and /metrics.
  register-sync:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_REGISTER_SYNC: ${DB_PASSWORD_REGISTER_SYNC:?set DB_PASSWORD_REGISTER_SYNC in .env}
      REGISTER_URL: http://fake-register:8090/protected
    restart: unless-stopped
    networks:
      - edge_register_db
      - edge_register_fakes
    depends_on:
      db:
        condition: service_healthy
      fake-register:
        condition: service_started
    command: ["python", "-m", "app.register.sync"]

  # Stand-ins for the systems outside the supplier (app/fakes). They record the calls they get
  # (GET /calls, from inside their own container) and have no database: each is on its one
  # caller's edge only. Port 9000 serves /healthz and /metrics.
  fake-register:
    <<: *app
    environment:
      FAKE_REGISTER_PROTECTED: SP-1003
    restart: unless-stopped
    networks:
      - edge_register_fakes
    depends_on: []
    command: ["python", "-m", "app.fakes.register"]

  fake-dso:
    <<: *app
    restart: unless-stopped
    networks:
      - edge_executor_dso
    depends_on: []
    command: ["python", "-m", "app.fakes.dso"]

  fake-sms:
    <<: *app
    restart: unless-stopped
    networks:
      - edge_executor_sms
    depends_on: []
    command: ["python", "-m", "app.fakes.sms"]

  # The tool gateway (8080 /mcp, 9000 ops): the one way from the agent to a tool. Checks the lease,
  # the stop switch and the arguments, asks the risk engine about every call, compares the tool's
  # description with the reviewed one and signs a token the tool accepts once. The only holder of
  # the signing key. In Compose there is no token, so the gateway accepts a call only from an
  # address in the subnet pinned on edge_agent_gateway (CALLER_SUBNET), where only the agent is.
  # The tools and the risk engine share an edge with the gateway too, but reach it from their own
  # networks' addresses and are refused with 401. Kubernetes uses the agent's service account
  # token and the bound pod instead.
  tool-gateway:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_GATEWAY: ${DB_PASSWORD_GATEWAY:?set DB_PASSWORD_GATEWAY in .env}
      CALLER_AUTH: compose
      CALLER_SUBNET: 10.250.1.0/24
      GATEWAY_SIGNING_KEY_FILE: /run/secrets/gateway_signing_key
      RISK_URL: http://risk-engine:8082
      TOOL_URL_READ_TICKET: http://tool-read-ticket:8000/mcp
      TOOL_URL_LOOKUP_ACCOUNT: http://tool-lookup-account:8000/mcp
      TOOL_URL_REQUEST_DISCONNECTION: http://tool-request-disconnection:8000/mcp
      TOOL_URL_ISSUE_BILL_CREDIT: http://tool-issue-bill-credit:8000/mcp
      TOOL_URL_SET_TEMP_PROTECTION: http://tool-set-temp-protection:8000/mcp
    restart: unless-stopped
    networks:
      - edge_agent_gateway
      - edge_gateway_read_ticket
      - edge_gateway_lookup_account
      - edge_gateway_request_disconnection
      - edge_gateway_issue_bill_credit
      - edge_gateway_set_temp_protection
      - edge_gateway_risk
      - edge_gateway_db
    secrets:
      - gateway_signing_key
    depends_on:
      db:
        condition: service_healthy
      risk-engine:
        condition: service_started
      tool-read-ticket:
        condition: service_started
      tool-lookup-account:
        condition: service_started
      tool-request-disconnection:
        condition: service_started
      tool-issue-bill-credit:
        condition: service_started
      tool-set-temp-protection:
        condition: service_started
    command: ["python", "-m", "app.gateway.main"]

  # The dispatcher (8081 /claim and /reply, 9000 ops): gives the agent its ticket and a lease, takes
  # the reply, runs the reply guard again outside the agent, stores it and ends the lease. Its
  # database role reads only ticket id and status. In Compose it accepts a call only from an address
  # in the subnet pinned on edge_agent_dispatcher (CALLER_SUBNET), where only the agent is; there is
  # no token here. Kubernetes uses the agent's service account token and starts a Job per ticket.
  dispatcher:
    <<: *app
    environment:
      <<: *db-common
      DB_PASSWORD_DISPATCHER: ${DB_PASSWORD_DISPATCHER:?set DB_PASSWORD_DISPATCHER in .env}
      CALLER_AUTH: compose
      DISPATCH_MODE: compose
      CALLER_SUBNET: 10.250.2.0/24
    restart: unless-stopped
    networks:
      - edge_agent_dispatcher
      - edge_dispatcher_db
    command: ["python", "-m", "app.dispatcher.main"]

  # The LLM gateway (8083 /next, 9000 ops): the agent's only way to a model, and the only place that
  # would hold a model key or identity. The default backend is the scripted one (a model that obeys
  # the ticket, for the tests and the demo): it needs no key and no route out, and this service has
  # neither. A real model is added with compose.llm-anthropic.yaml, which gives this service, and only
  # this service, the key and a route out. It accepts a call only from an address in the subnet pinned
  # on edge_agent_llmgw (CALLER_SUBNET), where only the agent is; it keeps a token budget per lease and
  # forwards none of the agent's headers. Kubernetes uses the agent's service account token instead.
  llm-gateway:
    <<: *app
    environment:
      CALLER_AUTH: compose
      CALLER_SUBNET: 10.250.3.0/24
      LLM_BACKEND: scripted
      LLM_MODEL: claude-haiku-5-5
      LLM_TOKEN_BUDGET_PER_LEASE: "20000"
      LLM_TOKEN_BUDGET_TOTAL: "500000"   # all leases and callers together, per 15 minutes
    restart: unless-stopped
    networks:
      - edge_agent_llmgw
    depends_on: []
    command: ["python", "-m", "app.llmgw.main"]

  # No database password, no key and no model key here: the agent only talks to the tool gateway, the
  # LLM gateway and the dispatcher. It takes no ticket number: the dispatcher decides.
  agent:
    <<: *app
    profiles: ["manual"]
    # Three edges, to the gateway, the LLM gateway and the dispatcher: no route to the db, to a tool,
    # to the risk engine or to the executor.
    networks:
      - edge_agent_gateway
      - edge_agent_llmgw
      - edge_agent_dispatcher
    depends_on:
      - tool-gateway
      - llm-gateway
      - dispatcher
    environment:
      VULNERABLE: ${VULNERABLE:-false}
      CALLER_AUTH: compose
      GATEWAY_URL: http://tool-gateway:8080/mcp
      LLM_GATEWAY_URL: http://llm-gateway:8083
      DISPATCHER_URL: http://dispatcher:8081
    command: ["python", "-m", "app.agent.main"]
