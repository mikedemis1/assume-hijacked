# A real model for the LLM gateway: the Anthropic API.
#
#   sh scripts/gen-gateway-key.sh                      (the stack's own keys, once)
#   printf '%s' "$KEY" > build/keys/anthropic.key      (build/keys/ is not in the repository)
#   docker compose -f compose.yaml -f compose.llm-anthropic.yaml up -d --build
#
# This changes the LLM gateway and nothing else. It is the only service that gets the key and the only
# one with a route out, which is why it is a separate file: the stack as shipped has neither, and the
# agent has neither in any case. The route out is an ordinary Docker network, so Compose cannot limit
# it to api.anthropic.com; the Kubernetes deployment does (a policy on the host name, see docs/azure.md).
# Calls cost money: the token budget per lease (LLM_TOKEN_BUDGET_PER_LEASE) is the limit.

secrets:
  anthropic_api_key:
    file: ./build/keys/anthropic.key

networks:
  egress_llm: {}

services:
  llm-gateway:
    environment:
      LLM_BACKEND: anthropic
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    networks:
      - egress_llm
    secrets:
      - anthropic_api_key
