[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assume-hijacked"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "mutmut==3.8.0",
    "pip-tools==7.6.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: needs the full docker compose stack running"]
addopts = "-m 'not smoke' -rs"

# bandit reads this only with `-c pyproject.toml` (ci/sast.sh passes it):
# https://bandit.readthedocs.io/en/latest/config.html
# The severity and confidence thresholds are command-line options, also in ci/sast.sh.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "mutants"]

# mutmut 3.8 option names, checked against mutmut/configuration.py of the installed version
# and https://mutmut.readthedocs.io/en/latest/ . Run by ci/mutation.sh.
[tool.mutmut]
source_paths = ["app/"]
# The walls: the agent loop and reply guard, the executor, and the account lookup tool.
only_mutate = [
    "app/agent/core.py",
    "app/agent/guard.py",
    "app/executor/*",
    "app/tools/lookup_account.py",
]
# Copied next to the mutated code: conftest.py reloads the seed data from db/sql before each test.
also_copy = ["db/sql/"]
# These test files read repository files (locks, Dockerfile, pipeline, ci/ scripts) or need the
# running Compose stack (smoke), not app code; they kill no mutant and would fail in the
# mutants/ copy, which has none of those files. tests/test_ci.py checks this list.
pytest_add_cli_args_test_selection = [
    "--ignore=tests/test_supply_chain.py",
    "--ignore=tests/test_ci.py",
    "--ignore=tests/test_smoke.py",
    # Imports secops/ and reads security/ and compose.yaml, none of which is in mutants/.
    "--ignore=tests/test_permassess.py",
]
