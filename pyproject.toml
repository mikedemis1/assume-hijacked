[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assume-hijacked"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    # Imported by app/security and app/tools/serve.py. Already locked as dependencies of mcp; named
    # here because the code uses them directly.
    "pyjwt[crypto]==2.15.1",
    "httpx2==2.13.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "mutmut==3.8.0",
    "pip-tools==7.6.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "k8s: needs the kind cluster ah running (sh scripts/kind-up.sh)",
]
addopts = "-m 'not k8s' -rs"

# ruff: a narrower set than ruff's default rule set: the errors and pyflakes rules that find real
# mistakes (unused imports, undefined names). https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture imported from another module and then named as a test argument is "redefined".
# Only this file, so F811 still catches a duplicated test name everywhere else.
"tests/unit/test_tokens.py" = ["F811"]
# The headline attack files import the fixtures and helpers of the unit tests they were moved from.
"tests/attacks/test_asi*.py" = ["F401", "F811"]
