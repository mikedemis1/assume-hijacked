# Pipeline for assume-hijacked: lint, test, build.
# Keyword reference: https://docs.gitlab.com/ci/yaml/
#
# Terraform plan and apply and the Helm deploy are designed at the Azure step and are not here yet.
#
# Images: tag for humans, digest for the pull (a tag can move, a digest cannot). Each tag was at
# least 14 days old on Docker Hub when pinned (checked 2026-10-15). The python image is the one in
# the Dockerfile and the postgres image is the one in scripts/test-db.sh, so CI tests what ships.
# Tools a job needs besides its image (ruff, gitleaks, terraform, helm, trivy) are downloaded at a pinned
# version and checked against a sha256 in scripts/ci-tools.sh. tests/test_pipeline.py checks all of it.

# Branch pipelines, or merge request pipelines when a merge request is open, never both:
# https://docs.gitlab.com/ci/yaml/workflow/
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - lint   # ruff, gitleaks, terraform fmt and validate, helm lint, Trivy config: no database, no Docker daemon
  - test   # unit and attack tests against a PostgreSQL service, and the chart render tests
  - build  # the app image and a Trivy scan of it, Docker-in-Docker

default:
  interruptible: true

# pip's download cache for the Python jobs, keyed on the dev lock: a new lock starts a new cache.
# pip still checks every file against the lock's sha256 (--require-hashes), cached or not.
# https://docs.gitlab.com/ci/caching/
.pip-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - requirements-dev.lock
    paths:
      - .cache/pip

# --- lint ---------------------------------------------------------------------------------

lint:
  # gitleaks: https://github.com/gitleaks/gitleaks
  # Full history: GIT_DEPTH 0 turns off the shallow clone and fetches all branches and tags
  # (https://docs.gitlab.com/ci/pipelines/settings/, "Limit the number of changes fetched during
  # clone"); the unshallow below is the second line of defence if a runner ignores it.
  # terraform: init -backend=false reads no state and needs no Azure login; the provider plugins
  # come from the registry and the committed .terraform.lock.hcl decides their versions and hashes.
  # helm lint here has no install values (the chart tests in the test job lint with them).
  # trivy config: scripts/trivy-config.sh renders the chart for kind and Azure (the python and the
  # pip install are for scripts/render-chart.py), scans it with infra/ and the Dockerfiles, and
  # fails on HIGH and CRITICAL that .trivyignore does not accept. The checks are the ones built
  # into the pinned trivy, so the rules change only with the version.
  extends: .pip-cache
  stage: lint
  image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - . scripts/ci-tools.sh
    - install_tools ruff gitleaks terraform helm trivy
    - python -m pip install --quiet --root-user-action=ignore --require-hashes -r requirements-dev.lock
    - ruff check .
    - mkdir -p reports
    - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow --quiet; fi
    - echo "commits to scan $(git rev-list --all --count)"
    - gitleaks git --redact --verbose --log-opts="--all" --report-format json --report-path reports/gitleaks.json .
    - terraform fmt -check -recursive -diff infra
    - |
      set -eu
      stacks=$(find infra -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort)
      if [ -z "$stacks" ]; then
        echo "no Terraform stack found under infra" >&2
        exit 1
      fi
      for stack in $stacks; do
        echo "== $stack"
        terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
        terraform -chdir="$stack" validate
      done
    - helm lint deploy/helm/assume-hijacked -f deploy/helm/assume-hijacked/values-kind.yaml
    - helm lint deploy/helm/assume-hijacked -f deploy/helm/assume-hijacked/values-azure.yaml
    - sh scripts/trivy-config.sh reports/trivy-config.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/gitleaks.json
      - reports/trivy-config.json

# --- test ---------------------------------------------------------------------------------

# A throwaway PostgreSQL for the job: https://docs.gitlab.com/ci/services/
# It cannot mount db/init, so scripts/ci-db-setup.sh runs db/init/init.sh against it over the
# network, first swapping the bootstrap password below for a random one. The bootstrap value is
# not a secret: the database lives for one job, has fake data, and only that job's network reaches it.
.postgres-service:
  services:
    - name: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      alias: postgres
      variables:
        POSTGRES_DB: supplier
        POSTGRES_PASSWORD: &postgres-bootstrap bootstrap-only-replaced-by-ci-db-setup
  variables:
    POSTGRES_BOOTSTRAP_PASSWORD: *postgres-bootstrap
    # tests/conftest.py runs against this host only because GITLAB_CI=true and it is a bare alias.
    TEST_DB_SERVICE_HOST: postgres

test:
  # The whole default suite, including the chart render tests (tests/k8s/test_chart.py and
  # test_monitoring.py: helm template, then the admission and network-policy objects, no cluster).
  # Those tests skip themselves without helm, so the job installs it and then the suite must
  # not skip them (test_helm_is_installed_when_the_pipeline_runs_the_tests). The monitoring chart
  # is downloaded from its repository; AH_REQUIRE_MONITORING_RENDER makes a failed download fail.
  # pytest JUnit report: https://docs.gitlab.com/ci/testing/unit_test_reports/
  extends:
    - .postgres-service
    - .pip-cache
  stage: test
  image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  variables:
    AH_REQUIRE_MONITORING_RENDER: "1"
  script:
    - . scripts/ci-tools.sh
    - install_tools helm
    - python -m pip install --quiet --root-user-action=ignore --require-hashes -r requirements-dev.lock
    - . scripts/ci-db-setup.sh
    - mkdir -p reports
    - python -m pytest -q --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/junit.xml
    reports:
      junit: reports/junit.xml

# --- build --------------------------------------------------------------------------------

build:
  # Docker-in-Docker with TLS between the job and the daemon:
  # https://docs.gitlab.com/ci/docker/using_docker_build/
  # https://docs.gitlab.com/ci/docker/docker_in_docker/
  # Needs a runner that allows privileged mode (GitLab.com instance runners do).
  # trivy: https://trivy.dev/latest/docs/configuration/filtering/
  # Two runs: a full report kept as artifacts, including unfixed and fix_deferred vulnerabilities,
  # and the gate on HIGH/CRITICAL with a fix. An accepted one goes in .trivyignore with the reason
  # and an expiry date (exp:YYYY-MM-DD).
  # Container scanning report format: https://docs.gitlab.com/ci/yaml/artifacts_reports/
  stage: build
  image: docker:29.8.1-cli@sha256:018edbc908e08fcc9dbf029c812c34251e9b4719e6f71ca0e5eae2a987d014ca
  services:
    - name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
      alias: docker
  # The client settings are explicit, as in the docs' TLS example: the docker image's entrypoint
  # only sets them if the service's certificates already exist when the job starts.
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  script:
    - |
      set -eu
      # The dind service may still be starting (and writing its TLS certificates) when the job
      # script begins: wait until `docker info` answers, at most about 30 s.
      tries=0
      until docker info >/dev/null 2>&1; do
        tries=$((tries + 1))
        if [ "$tries" -ge 30 ]; then
          echo "the Docker daemon did not answer within 30 s (DOCKER_HOST=${DOCKER_HOST:-unset})" >&2
          docker info >&2 || true
          exit 1
        fi
        sleep 1
      done
      image=assume-hijacked:scan
      docker build --tag "$image" .

      # trivy runs as a container next to the build and reads the image through the Docker
      # socket of that daemon; the database is kept in a volume, so the second run reuses it.
      trivy() {
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" \
          -v assume-hijacked-trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" "$@"
      }

      # 1. Report, never fails the job: every severity, fixed or not (unfixed, will_not_fix and
      # fix_deferred included), as JSON and in GitLab's container scanning format.
      mkdir -p reports
      trivy image --scanners vuln --exit-code 0 --no-progress --skip-version-check \
        --format json --output /repo/reports/trivy-all.json "$image"
      trivy convert --format template --template @/contrib/gitlab.tpl \
        --output /repo/reports/gl-container-scanning-report.json /repo/reports/trivy-all.json
      echo "== report only: every HIGH and CRITICAL, with or without a fix"
      trivy convert --format table --severity HIGH,CRITICAL /repo/reports/trivy-all.json

      # 2. Gate: fails on a HIGH or CRITICAL that has a fixed version.
      ignore=
      if [ -f .trivyignore ]; then
        ignore="--ignorefile /repo/.trivyignore"
      fi
      echo "== gate: HIGH and CRITICAL with a fixed version"
      # shellcheck disable=SC2086  # $ignore is empty or two words on purpose
      trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
        --exit-code 1 --no-progress --skip-version-check $ignore "$image"
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/trivy-all.json
      - reports/gl-container-scanning-report.json
    reports:
      container_scanning: reports/gl-container-scanning-report.json
